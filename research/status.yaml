added:
  - date: 2026-08-25
    note: Content viewing milestone — ADR-0012 (DOMPurify sanitization), ADR-0013 (activity renderers), TECH-009
  - date: 2026-08-25
    note: Static previews — ADR-0014 (pdf.js canvas + opaque-origin HTML sandbox), TECH-010
  - date: 2026-08-25
    note: Docs site — ADR-0015 (Rspress 2 in apps/docs, unified static deploy; VitePress fallback). TECH-012/TECH-013 registered. ADR template splits decision body from investigation addendum.
  - date: 2026-08-25
    note: Detail pane rebuilt as toolbar + Preview/Info/Raw tabs; per-activity export shipped — ADR-0016 (module XML, rendered content HTML, files ZIP; no whole-backup re-packaging). fflate declared in core and viewer.
  - date: 2026-08-25
    note: Sandboxed previews fixed against real backups — ADR-0017 supersedes ADR-0014 (inline data: assets instead of unusable app-origin blob: URLs; allow-popups + escape so author links open a tab). Random quiz slots now resolve to their bank category pool instead of claiming the questions are absent.
  - date: 2026-08-25
    note: Experimental H5P playback — ADR-0018 adopts h5p-standalone (TECH-014) inside the ADR-0017 opaque-origin sandbox via an in-memory virtual filesystem shim. Synthetic .h5p package added to the demo fixture. Vendored-core GPL question recorded as open risk.
  - date: 2026-08-25
    note: H5P playback verified against real packages (REPO-009) — fixed media loading (new Image() bypassed the shim; H5P.getPath() injects a content-id segment) and string library versions. Upstream licensing clarification requested (tunapanda/h5p-standalone#188). Real specimens stay un-vendored; synthetic fixture should grow to cover the same shapes.
  - date: 2026-08-25
    note: >-
      Quizzes built from random slots now page through the pool they draw from
      instead of repeating N identical placeholders, captioned with how many an
      attempt actually asks (SMR_SEGI 10-of-30, SMR_SOR 20-of-30). Moodle's
      $@CODE*arg@$ link tokens are decoded against <original_wwwroot> —
      ADR-0019; $@NULL@$ is normalized away at the activity parse boundary.

risks:
  RISK-001:
    title: fflate materializes every entry in memory during unzip
    severity: high
    probability: certain-for-large-files
    mitigation: documented limit in ADR-0005; TASK-003 tracks streaming/lazy access
    status: accepted-for-bootstrap
  RISK-002:
    title: Section-to-activity mapping inferred from sectionid/sequence may miss course-format-specific nesting (e.g. flexsections)
    severity: medium
    probability: likely
    mitigation: Q-002 kept open; parser emits warnings instead of failing
    status: monitored
  RISK-003:
    title: zip.js currently unusable under Bun runtime (EXP-002); browser-only adoption would create untested-in-CI code paths
    severity: medium
    probability: observed
    mitigation: single fflate path until large-file milestone re-evaluates (Q-004)
    status: mitigated-by-decision
  RISK-004:
    title: h5p-standalone vendors H5P core JS from a GPL-3.0 repository distribution while the npm package declares MIT
    severity: medium
    probability: confirmed
    mitigation: recorded in TECH-014/ADR-0018; playback stays experimental and is re-reviewed before any non-experimental release
    upstream: https://github.com/tunapanda/h5p-standalone/issues/188 (opened 2026-08-25, awaiting maintainer reply)
    status: monitored
