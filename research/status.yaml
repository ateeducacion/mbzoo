added:
  - date: 2026-08-25
    note: Content viewing milestone — ADR-0012 (DOMPurify sanitization), ADR-0013 (activity renderers), TECH-009
  - date: 2026-08-25
    note: Static previews — ADR-0014 (pdf.js canvas + opaque-origin HTML sandbox), TECH-010
  - date: 2026-08-25
    note: Docs site — ADR-0015 (Rspress 2 in apps/docs, unified static deploy; VitePress fallback). TECH-012/TECH-013 registered. ADR template splits decision body from investigation addendum.
  - date: 2026-08-25
    note: Detail pane rebuilt as toolbar + Preview/Info/Raw tabs; per-activity export shipped — ADR-0016 (module XML, rendered content HTML, files ZIP; no whole-backup re-packaging). fflate declared in core and viewer.
  - date: 2026-08-25
    note: Sandboxed previews fixed against real backups — ADR-0017 supersedes ADR-0014 (inline data: assets instead of unusable app-origin blob: URLs; allow-popups + escape so author links open a tab). Random quiz slots now resolve to their bank category pool instead of claiming the questions are absent.
  - date: 2026-08-25
    note: Experimental H5P playback — ADR-0018 adopts h5p-standalone (TECH-014) inside the ADR-0017 opaque-origin sandbox via an in-memory virtual filesystem shim. Synthetic .h5p package added to the demo fixture. Vendored-core GPL question recorded as open risk.
  - date: 2026-08-25
    note: H5P playback verified against real packages (REPO-009) — fixed media loading (new Image() bypassed the shim; H5P.getPath() injects a content-id segment) and string library versions. Upstream licensing clarification requested (tunapanda/h5p-standalone#188). Real specimens stay un-vendored; synthetic fixture should grow to cover the same shapes.
  - date: 2026-08-25
    note: >-
      Quizzes built from random slots now page through the pool they draw from
      instead of repeating N identical placeholders, captioned with how many an
      attempt actually asks (SMR_SEGI 10-of-30, SMR_SOR 20-of-30). Moodle's
      $@CODE*arg@$ link tokens are decoded against <original_wwwroot> —
      ADR-0019; $@NULL@$ is normalized away at the activity parse boundary.
  - date: 2026-08-25
    note: >-
      Multi-page HTML resources fixed against SMR_SOR's eXeLearning export —
      ADR-0020. Sibling pages were inlined as raw data: documents, so following
      a link stranded the page without its stylesheet and outside the injected
      CSP; those links are now defused and the site is navigated from a page row
      in MBZoo's own chrome. An empty glossary in a backup taken without user
      data (users=0) now says so instead of reading like a parse gap.
  - date: 2026-08-25
    note: >-
      $@NULL@$ normalized at every parse boundary (shared leafValue in
      moodle/xml.ts) after PRDV103 showed it as a sidebar heading; an unnamed
      section now resolves through moodle_backup.xml's number-as-title
      placeholder and renders as Moodle's "General" (REPO-005). mod_feedback
      gets a parser and renderer (item order, packed multichoice options).
      match questions read their pairs from plugin_qtype_match_question instead
      of showing an empty stem. Undecodable link tokens carry a visible marker
      and name the code. Fixture grew a feedback activity; the recorded sha256
      for the PRDV103 specimen was wrong and is corrected in the manifest.
  - date: 2026-08-25
    note: >-
      Module coverage survey against moodle/moodle 5.3dev: the gate is not which
      modules exist but which still carry authored content once userinfo is off.
      Implemented lesson (pages/answers/jumps), choice, data (field schema),
      workshop (instructions + examples), imscp (ADR-0021 PHP-serialized TOC)
      and typed summaries for forum/chat/wiki; video and audio now preview
      inline. SCORM deliberately left out — tracked separately. Fixed a latent
      worker bug where two reads in flight clobbered each other's handler, so
      one promise never settled and a renderer stopped mid-way in silence.
  - date: 2026-08-25
    note: >-
      Demo fixture now covers every renderer MBZoo has (url, folder, chat and
      wiki added; folder carries a generated 8-bit WAV so the new audio preview
      has real coverage). CodeQL alert 7 (js/polynomial-redos, high) fixed:
      backupLinkUrl trimmed trailing slashes with /\/+$/ on a value that comes
      out of the backup; it now scans linearly, with a regression test.
  - date: 2026-08-25
    note: >-
      Modules Moodle has retired (chat/survey 5.0 MDL-82457, assignment 4.2
      MDL-72350) are labelled "retired" next to the module name, with a notice
      saying no current Moodle can restore them and MBZoo still reads them.
      Releases verified in the Moodle tree (mod/UPGRADING.md and the removal
      commits), not from memory.
  - date: 2026-08-25
    note: >-
      Playwright's preview server moved off the fixed port 4173 to one derived
      from the checkout path, with reuseExistingServer off. Two working trees
      of this repo both served on 4173, so one tree's suite silently tested the
      other tree's build — a failure that looks exactly like a broken renderer.
      Footer reworked (single line, ATE credit, Moodle trademark notice, repo
      link) and t() now treats an empty translation as deliberate rather than
      missing, which had printed the key itself on the Spanish landing page.
  - date: 2026-08-25
    note: >-
      Parsers built from the Moodle schema are now verified against real Moodle
      output: a Moodle 5.2.2 course generated in erseco/alpine-moodle and backed
      up with users=0, plus Moodle's own mod_subsection and backup_controller
      test fixtures (all recorded in fixtures/manifest.yaml, none committed).
      That caught a real bug — lesson answers whose jumpto is page id 1 or 2
      were read as LESSON_UNSEENPAGE/UNANSWEREDPAGE, which belong to the
      lesson-level nextpagedefault setting and never to an answer. Delegated
      sections (Moodle 4.5+ mod_subsection) now resolve to the module that owns
      them and nest under it in the tree, instead of appearing as siblings.
  - date: 2026-08-25
    note: >-
      Grading surfaced end to end: per-activity grade items (grades.xml),
      rubrics and marking guides (grading.xml) and the course gradebook
      (gradebook.xml, shown in the otherwise blank detail pane). module.xml's
      completionview/completionpassgrade are read at last, resource/url display
      modes are named from RESOURCELIB_DISPLAY_*, and qbank/lti/bigbluebuttonbn
      get typed summaries. Constants from lib/grade/constants.php and
      lib/resourcelib.php (REPO-005); every shape verified against the Moodle
      5.2.2 specimen and SMR_SOR's eight-category gradebook.
  - date: 2026-08-25
    note: >-
      users.xml is read at last. A backup taken with users=1 carries names,
      emails, usernames, ID numbers, phones, postal addresses, last-login IPs
      and profile descriptions — verified on a Moodle 5.2.2 backup taken with
      the box ticked. MBZoo now leads with the disclosure (how many people,
      which kinds of data are actually populated) and keeps the names behind a
      closed details element. The demo fixture stays content-only on purpose:
      the public demo should not ship a personal-data warning.

risks:
  RISK-001:
    title: fflate materializes every entry in memory during unzip
    severity: high
    probability: certain-for-large-files
    mitigation: documented limit in ADR-0005; TASK-003 tracks streaming/lazy access
    status: accepted-for-bootstrap
  RISK-002:
    title: Section-to-activity mapping inferred from sectionid/sequence may miss course-format-specific nesting (e.g. flexsections)
    severity: medium
    probability: likely
    mitigation: Q-002 kept open; parser emits warnings instead of failing
    status: monitored
  RISK-003:
    title: zip.js currently unusable under Bun runtime (EXP-002); browser-only adoption would create untested-in-CI code paths
    severity: medium
    probability: observed
    mitigation: single fflate path until large-file milestone re-evaluates (Q-004)
    status: mitigated-by-decision
  RISK-004:
    title: h5p-standalone vendors H5P core JS from a GPL-3.0 repository distribution while the npm package declares MIT
    severity: medium
    probability: confirmed
    mitigation: recorded in TECH-014/ADR-0018; playback stays experimental and is re-reviewed before any non-experimental release
    upstream: https://github.com/tunapanda/h5p-standalone/issues/188 (opened 2026-08-25, awaiting maintainer reply)
    status: monitored
