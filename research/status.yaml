risks:
  RISK-001:
    title: fflate materializes every entry in memory during unzip
    severity: high
    probability: certain-for-large-files
    mitigation: documented limit in ADR-0005; TASK-003 tracks streaming/lazy access
    status: accepted-for-bootstrap
  RISK-002:
    title: Section-to-activity mapping inferred from sectionid/sequence may miss course-format-specific nesting (e.g. flexsections)
    severity: medium
    probability: likely
    mitigation: Q-002 kept open; parser emits warnings instead of failing
    status: monitored
  RISK-003:
    title: zip.js currently unusable under Bun runtime (EXP-002); browser-only adoption would create untested-in-CI code paths
    severity: medium
    probability: observed
    mitigation: single fflate path until large-file milestone re-evaluates (Q-004)
    status: mitigated-by-decision
