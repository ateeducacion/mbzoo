# Codecov configuration for the public repository.
# CI treats Codecov upload and configuration errors as failures.
codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: 90%
    patch:
      default:
        target: 90%

comment:
  layout: "reach, diff, flags, files"
  behavior: default

ignore:
  - e2e
  - fixtures
  - research
  - docs
