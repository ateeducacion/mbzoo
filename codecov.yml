# Codecov configuration. Public repository; token required only because
# `main` is a protected branch (set CODECOV_TOKEN repo secret).
codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: 90%
    patch:
      default:
        target: 90%

comment:
  layout: reach, diff, flags, files
  behavior: default

ignore:
  - "e2e"          # test harness itself
  - "fixtures"     # generator scripts, not shipped code
  - "research"     # documentation/tooling
  - "docs"
EOF
