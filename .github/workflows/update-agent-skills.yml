# GITHUB_TOKEN-created PRs do not trigger CI. Review prompt changes before merging.
name: Update agent skills

on:
  schedule:
    # Weekly, Mondays at 06:43 UTC. Offset from the other Monday schedules.
    - cron: "43 6 * * 1"
  workflow_dispatch:

# Only the update job can push a branch and open a PR.
permissions: {}

concurrency:
  group: update-agent-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: update
        uses: devantler-tech/actions/update-agent-skills@v13.6.5
        with:
          dir: .agents/skills

      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(deps): update agent skills"
          title: "chore(deps): update agent skills"
          body: |
            Weekly `gh skill update --all` run against `.agents/skills/`.

            ```text
            ${{ steps.update.outputs.updated-skills }}
            ```

            Skills are prompts that coding agents follow, so an upstream change
            is a behaviour change: skim the diff before merging.
          add-paths: .agents/skills/**
          branch: feature/update-agent-skills
          delete-branch: true
