name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / unit / build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Same commands as local `bun run check` (AGENTS.md), kept split for
      # useful per-step CI diagnostics.
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun test packages apps fixtures
      - run: bun run test:coverage
      - uses: codecov/codecov-action@v7
        # Dependabot PRs cannot read Actions secrets, so CODECOV_TOKEN is empty
        # and Codecov rejects the upload ("Token required because branch is
        # protected"). Tests still run; coverage from those PRs matches main.
        if: github.actor != 'dependabot[bot]'
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A silent coverage gap is worse than a red CI run.
          fail_ci_if_error: true
      - run: bun run build
      - run: bun run research:validate

  e2e:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check
    strategy:
      # Every browser reports: one failing engine must not hide the others.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Build first: vite preview serves apps/viewer/dist.
      - run: bun run build:viewer
      - run: bunx playwright install ${{ matrix.browser }} --with-deps
      - run: bunx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
