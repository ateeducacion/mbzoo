name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / unit / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Same commands as local `bun run check` (AGENTS.md).
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun test packages apps fixtures
      # lcov for Codecov. Tokenless uploads are rejected on protected
      # branches; set the CODECOV_TOKEN repo secret from codecov.io.
      - run: bun run test:coverage
      - uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - run: bun run build
      - run: bun run research:validate

  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Build first: vite preview serves apps/viewer/dist.
      - run: bun run build:viewer
      - run: bunx playwright install chromium --with-deps
      - run: bunx playwright test --project=chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Full browser matrix is intentionally deferred (TASK-002) until browser
  # caching makes it cheap; do not block PRs on it.
