version: 2

# Bun 1.4 can read and preserve an existing v1 text lockfile. Keep bun.lock at
# lockfileVersion 1 until dependabot/dependabot-core#16026 adds v2 support to
# the hosted Bun updater.
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 10
    groups:
      bun-non-breaking:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 10
    groups:
      actions-non-breaking:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
